name: Monitor diarios oficiales

on:
  schedule:
    - cron: "0 7 * * *"
      timezone: "America/Monterrey"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Días calendario a revisar (2 = ayer + hoy)"
        required: false
        default: "2"
      source:
        description: "Fuente"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - dof
          - nuevo-leon

concurrency:
  group: monitor-diarios-oficiales
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    name: Monitor ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 330

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        source:
          - dof
          - nuevo-leon

    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
      GOOGLE_SHEET_TAB: ${{ vars.GOOGLE_SHEET_TAB || 'Monitor' }}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
      # La ejecución diaria de las 07:00 revisa ayer + hoy. Esto cubre
      # operacionalmente la ventana 07:01 de ayer -> 07:00 de hoy; las
      # publicaciones ya registradas no vuelven a escribirse en Sheets.
      LOOKBACK_DAYS: ${{ inputs.lookback_days || vars.LOOKBACK_DAYS || '2' }}
      OCR_DPI: ${{ vars.OCR_DPI || '150' }}
      OCR_WORKERS: ${{ vars.OCR_WORKERS || '4' }}
      OMP_THREAD_LIMIT: "1"

    steps:
      - name: Determinar si esta fuente debe ejecutarse
        id: selected
        shell: bash
        run: |
          REQUESTED="${{ inputs.source || 'all' }}"
          CURRENT="${{ matrix.source }}"
          if [ "$REQUESTED" = "all" ] || [ "$REQUESTED" = "$CURRENT" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Descargar código
        if: steps.selected.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Configurar Python
        if: steps.selected.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar Tesseract español
        if: steps.selected.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa
          tesseract --version
          tesseract --list-langs

      - name: Instalar proyecto
        if: steps.selected.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Pruebas del scraper
        if: steps.selected.outputs.run == 'true'
        run: python -m unittest discover -s tests -v

      - name: Revisar ${{ matrix.source }}, hacer OCR y subir a Drive
        if: steps.selected.outputs.run == 'true'
        shell: bash
        run: |
          python -m diario_monitor \
            --source "${{ matrix.source }}" \
            --lookback-days "$LOOKBACK_DAYS" \
            --ocr-dpi "$OCR_DPI" \
            --ocr-workers "$OCR_WORKERS" \
            --json
