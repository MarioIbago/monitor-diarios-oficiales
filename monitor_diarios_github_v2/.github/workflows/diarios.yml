name: Monitor diarios oficiales

on:
  schedule:
    - cron: "0 7 * * *"
      timezone: "America/Monterrey"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Días hacia atrás a revisar"
        required: false
        default: "1"
      source:
        description: "Fuente"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - dof
          - nuevo-leon

concurrency:
  group: monitor-diarios-oficiales
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
      GOOGLE_SHEET_TAB: ${{ vars.GOOGLE_SHEET_TAB || 'Monitor' }}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
      LOOKBACK_DAYS: ${{ inputs.lookback_days || vars.LOOKBACK_DAYS || '7' }}
      OCR_DPI: ${{ vars.OCR_DPI || '150' }}
      OCR_WORKERS: ${{ vars.OCR_WORKERS || '4' }}
      OMP_THREAD_LIMIT: "1"

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar Tesseract español
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa
          tesseract --version
          tesseract --list-langs

      - name: Instalar proyecto
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Pruebas del scraper
        run: python -m unittest discover -s tests -v

      - name: Revisar diarios, hacer OCR y subir a Drive
        shell: bash
        run: |
          SOURCE="${{ inputs.source || 'all' }}"
          python -m diario_monitor \
            --source "$SOURCE" \
            --lookback-days "$LOOKBACK_DAYS" \
            --ocr-dpi "$OCR_DPI" \
            --ocr-workers "$OCR_WORKERS" \
            --json
