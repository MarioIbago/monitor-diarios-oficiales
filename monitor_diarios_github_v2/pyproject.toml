[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "monitor-diarios-oficiales"
version = "0.2.0"
description = "DOF y Periodico Oficial de Nuevo Leon: OCR forzado, Google Drive y Google Sheets"
requires-python = ">=3.11"
dependencies = [
  "lxml>=5.0,<7",
  "google-api-python-client>=2.170,<3",
  "google-auth>=2.40,<3",
  "PyMuPDF>=1.26,<2",
  "pytesseract>=0.3.13,<1",
  "Pillow>=11,<13",
  "tzdata>=2025.2",
]

[project.scripts]
diarios-oficiales = "diario_monitor.cli:main"

[tool.setuptools.packages.find]
include = ["diario_monitor*"]
